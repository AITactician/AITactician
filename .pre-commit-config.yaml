# Kit starter (ai-config#33): copy to .pre-commit-config.yaml in a repository that has no hooks
# yet; templates/scaffold.sh copies it into every new project. The same file runs on a commit
# (`pre-commit install` once) and in CI (the kit's validate.yml). Every hook is pinned to a full
# commit SHA with a `# frozen:` comment, which Dependabot's pre-commit updates read and advance.
# Trimmed for a README and SVG repo: ShellCheck and check-json dropped (no shell or JSON files).
# Node hooks (markdownlint, Prettier, ESLint) use the system Node: unpinned, nodeenv reads "latest"
# from nodejs.org and crashes on an alpha entry. The scaffold's node-pin hook keeps this key.
default_language_version:
  node: system
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # frozen: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Secrets in the working tree, including gitignored local files when run on a Mac.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 43fae355e6fe4d99d2a7b240a224b85e2903aeb4  # frozen: v8.21.2
    hooks:
      - id: gitleaks
        entry: gitleaks detect --source . --no-git --redact --verbose --no-banner
        pass_filenames: false

  # GitHub Actions workflows: actionlint for syntax and expressions, zizmor for security findings.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
